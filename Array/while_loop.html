<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>While loop</h3>
    <script>
        let i = 1;
        while (i <= 10) {
            console.log('number = ', i);
            document.write('number = ', i + '</br>');
            i++
        }
        let word = prompt('Write some Word (exit for Close)')
        document.write('Word is = ', word)
        while(word != exit){
            document.write('Write some Word', word)
        }
    </script>
</body>

</html>
