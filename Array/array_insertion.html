        const insertEl = () => {
            let data = [2, 5, 4, 6, 7, 8, 4];
            let position = document.getElementById('position').value;
            let newVal = document.getElementById('newElement').value;
            newVal = parseInt(newVal)
            document.write(`Before Insert data = ${data} <br>`)
            for (i = data.length - 1; i >= 0; i--) {
                if (i >= position) {
                    data[i + 1] = data[i]
                    if (i == position) {
                        data[i] = newVal
                    }
                }
            }
            document.write('After Insert data =', data)
            console.log(data)
        }
    </script>
    <input type="number" id="position" placeholder="Enter your Position">
    <input type="number" id="newElement" placeholder="Enter your Element">
    <button onclick="insertEl()">Insert Element</button>
