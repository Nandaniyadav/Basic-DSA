<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>do while loop</h3>
    <h4>do-while loop ek exit-controlled loop hota hai, jo pehle statement execute karta hai, phir condition check karta
        hai.
        Agar condition true hoti hai, toh loop dobara chalega, warna loop terminate ho jayega.</h4>
    <script>
        let i = 1
        do {
            console.log('Nandani');
            document.write('Nandani' + '</br>')
            i++
        } while (i <= 5)
    </script>
</body>

</html>
