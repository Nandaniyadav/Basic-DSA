<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Traversing</title>
</head>

<body>
    <script>
        let data = [2, 5, 7, 9, 34, 67, 89,99];
        for (i = 0; i < data.length; i++) {
            document.write(`Data index ${i} =  ${data[i]} <br>`)
        }
    </script>

</body>

</html>
