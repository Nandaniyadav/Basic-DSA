<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Find Minimum Number</h2>
    <script>
        let arr = [10, 75, 80, 56, 65, 20, 96];
        console.log('Array is : ', arr);
        document.write("Array is : ", arr + '<br>')
        let min = arr[0];
        for (let i = 1; i < arr.length; i++) {
            if (min > arr[i]) {
                min = arr[i]
            }
        }
        console.log('Minimum', min);
        document.write('Minimum Number is in Array is = ', min + '<br>');
    </script>
</body>

</html>
