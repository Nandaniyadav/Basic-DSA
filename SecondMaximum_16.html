<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>Find 2nd Max Number in Array</h3>
    <script>
        let arr = [50, 23, 56, 32, 64, 70,70]
        console.log('Array is : ', arr);
        document.write('Array is : ', arr + "<br>");
        let firstMax = Math.max(arr[0], arr[1]);
        let secondMax = Math.min(arr[0], arr[1])
        console.log('FirstMax', firstMax);
        console.log('secondMax', secondMax);
        for (let i = 2; i < arr.length; i++) {
            if (arr[i] > firstMax) {
                secondMax = firstMax;
                firstMax = arr[i]
            } else if (arr[i] > secondMax && firstMax != arr[i]) {
                secondMax = arr[i]
            }
        }
        console.log('First Max =', firstMax);
        document.write('First Max = ', firstMax + '<br>');
        console.log('Second Max = ', secondMax);
        document.write('Second Max = ', secondMax + '<br>');
    </script>
</body>

</html>
