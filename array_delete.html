<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Element From Array</title>
</head>

<body>
    <script>
        let data = [10, 20, 30, 40, 50, 60];
        console.log('data = ', data);
        document.write(`Before Delete Element data =  ${data}<br>`);
        let position = 3;
        for (i = position; i <= data.length - 1; i++) {
            data[i] = data[i + 1]
        }
        data.length = data.length - 1;
        console.log('data ', data)
        document.write('After Delete Element data = ', data)

    </script>
</body>

</html>
