<body>
    <script>
        // let data = [10, 20, 30, 40, 50, 60];

        let deleteEl = () => {
            let data = [10, 20, 30, 40, 50, 60, 70];
            // document.write(`Before Delete data = ${data} <br>`);
            console.log(`Before Delete data = ${data}`);
            let myPosition = document.getElementById('position').value;
            myPosition = parseInt(myPosition)
            for (i = myPosition; i < data.length; i++) {
                data[i] = data[i + 1]
            }
            document.write('After Delete data = ', data)
        }
    </script>
    <input type="number" id="position" placeholder="Enter Position">
    <button onclick="deleteEl()">Delete Element</button>
