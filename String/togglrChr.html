<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Toggle Chracter</h2>
    <script>
        let checkChr = prompt("Enter the String : ");
        console.log('String is : ', checkChr);
        document.write('String is : ', checkChr);
        let toggle = '';
        for (let i = 0; i < checkChr.length; i++) {
            let asciiVal = checkChr.charCodeAt(i);
            console.log('iiiii', asciiVal);
            if (asciiVal >= 65 && asciiVal <= 90) {
                toggle = toggle + String.fromCharCode(asciiVal + 32)
            } else if (asciiVal >= 97 && asciiVal <= 122) {
                toggle = toggle + String.fromCharCode(asciiVal - 32)
            } else {
                toggle += checkChr[i];
            }
        }

        console.log('Toggle String = ', toggle);
        document.write('<br>Toggle String = ' + toggle);
    </script>
</body>

</html>
