<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>String</h3>
    <script>
        let str = "Nandani Yadav";
        console.log('String is = ', str);
        document.write('String is = ', str + '</br>');
        console.log('String Length is = ', str.length);
        document.write('String Length is = ', str.length + '<br>');

        document.write('slice String  is = ', str.slice(0, 6) + '<br>');
        document.write('From back String  is = ', str.slice(-3, str.length) + '<br>');
        document.write('From back String  is = ', str.slice(-6, str.length) + '<br>');

    </script>
</body>

</html>
