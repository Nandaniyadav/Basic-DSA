<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3> break </h3>
    <script>
        // break
        for (let i = 1; i <= 10; i++) {
            document.write('Number =  ', i + '</br>')
            if (i == 5) {  // Loop stops when i is 5
                break;
            }
        }
    </script>
</body>

</html>
