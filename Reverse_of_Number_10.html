<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2> Reverse of Number </h2>
    <script>
        let checkPrompt = prompt('Enter Number')
        console.log('checkPrompt', checkPrompt);
        if (checkPrompt === null) {
            console.log('Program Cancelled');
            document.write('Program Cancelled')
        } else {
            let num = Number(checkPrompt);
            console.log('Number is : ', num);
            document.write('Number is : ', num + '</br>')
            if (isNaN(num)) {
                console.log('Wrong Input');
                document.write('Wrong Input')
            } else {
                let rev = 0;
                if (num > 0) {
                    while (num > 0) {
                        let rem = num % 10;
                        rev = rev * 10 + rem
                        num = Math.floor(num / 10);
                    }
                    console.log('Reverse number is :', rev);
                    document.write('Reverse number is :', rev);
                }
                else {
                    console.log('Number should be Positive and greater then 0');
                    document.write('Number should be Positive and greater then 0');
                }
            }
        }

    </script>
</body>

</html>
