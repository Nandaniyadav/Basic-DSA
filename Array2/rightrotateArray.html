<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Right Rotate Array by 1</h2>
    <script>
        let arr = [1, 2, 3, 4, 5];
        console.log('Array is = ', arr);
        document.write('Array is = ', arr + '<br/>');
        let copy = arr[arr.length - 1]
        for (let i = arr.length - 1; i > 0; i--) {
            arr[i] = arr[i - 1];
            console.log('arr[i]', arr[i]);
        }
        arr[0] = copy;
        console.log('Right Rotate Array is = ', arr);
        document.write('Right Rotate Array is = ', arr);
    </script>
</body>

</html>
