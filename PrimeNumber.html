<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // A prime number is a natural number greater than 1 that has exactly two distinct factors: 1 and itself.
        //For example: 2, 3, 5, 7, 11, 13, 17 are prime numbers

        let checkPrompt = prompt('Enter Number')
        console.log('checkPrompt', checkPrompt);
        if (checkPrompt === null) {
            console.log('Program Cancelled');
            document.write('Program Cancelled')
        } else {
            let prime = Number(checkPrompt);
            console.log('Number is : ', prime);
            document.write('Number is : ', prime + '</br>')
            if (isNaN(prime)) {
                console.log('Wrong Input');
                document.write('Wrong Input')
            } else {
                if (prime > 0) {
                    if (prime == 2) {
                        console.log(`Number is Prime`);
                        document.write(`${prime} is Prime`);
                    } else {
                        if (prime % 2 !== 0) {
                            console.log(`Number is Prime`);
                            document.write(`${prime} is Prime`);
                        } else {
                            console.log(`Number is not Prome`);
                            document.write(`${prime} is not Prome`);
                        }
                    }

                } else {
                    console.log('Number should be Positive and greater then ');
                    document.write('Number should be Positive and greater then ');
                }
            }
        }

    </script>
</body>

</html>
