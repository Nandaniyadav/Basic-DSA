<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let checkPrompt = prompt('Enter Number')
        console.log('checkPrompt', checkPrompt);
        if (checkPrompt === null) {
            console.log('Program Cancelled');
            document.write('Program Cancelled')
        } else {
            let num = Number(checkPrompt);
            console.log('Number is : ', num);
            document.write('Number is : ', num + '</br>')
            if (isNaN(num)) {
                console.log('Wrong Input');
                document.write('Wrong Input')
            } else {
                if (num > 0) {
                    if (num % 2 !== 0) {
                        console.log(`Number is Prime`);
                        document.write(`${num} is Prime`);
                    } else {
                        console.log(`Number is not Prome`);
                        document.write(`${num} is not Prome`);
                    }

                } else {
                    console.log('Number should be Positive and greater then ');
                    document.write('Number should be Positive and greater then ');
                }
            }
        }

    </script>
</body>

</html>
