<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Create Guess Number</title>
</head>

<body>
    <script>
        let random = Math.floor(Math.random() * 100) + 1;
        console.log('random number = ', random);
        document.write('random number = ', random + '</br>');

        let guess = null;
        while (guess != random) {
            let input = prompt('Enter Any Number 1 to 100');
            if (input === null || input.trim() === "") {
                console.log("Game exited by user!");
                document.write("Game exited by user!"+ '</br>');
                break;
            }
            input = input.toString().trim();

            if (input === "") {
                console.log("Invalid input! Please enter a number.");
                document.write("Invalid input! Please enter a number."+ '</br>');
                continue;
            }
            guess = Number(input)
            if (isNaN(guess) || guess < 1 || guess > 100) {
                document.write('Try again between 1 to 100'+ '</br>');
                console.log('Try again between 1 to 100');
                continue;
            }
            if (guess > random) {
                document.write('Too High, try again'+ '</br>')
                console.log('Too High, try again');
            } else if (guess < random) {
                document.write('Too Low, Try again'+ '</br>')
                console.log('Too Low, Try again');
            } else {
                document.write('Congratulations! You guessed it right. 🎉 '+ '</br>')
                console.log(' Congratulations! You guessed it right. 🎉');
            }
        }

    </script>
</body>

</html>
