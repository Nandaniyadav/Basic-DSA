<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        // N=12 => Factor of 12 is = 1,2,3,4,6 and 12

        let checkPrompt = prompt('Enter Number')
        console.log('checkPrompt', checkPrompt);
        if (checkPrompt === null) {
            console.log('Program Cancelled');
            document.write('Program Cancelled')
        } else {
            let num = Number(checkPrompt);
            console.log('Number is : ', num);
            document.write('Number is : ', num + '</br>')
            if (isNaN(num)) {
                console.log('Wrong Input');
                document.write('Wrong Input')
            } else {
                if (num > 0) {
                    for (let i = 1; i <= Math.floor(num / 2); i++) {
                        if (num % i === 0) {
                            console.log('i=', i);
                            document.write(`Factor of ${num} is =  ${i}  </br>`)
                        }

                    }
                    console.log(num)
                    document.write(`Factor of ${num} is =  ${num}  </br>`)

                } else {
                    console.log('Number should be Positive and greater then ');
                }
            }
        }

    </script>
</body>

</html>
