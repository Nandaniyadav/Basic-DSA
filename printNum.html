<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //1-10

        for (let i = 1; i <= 10; i++) {
            console.log('i = ', i);
        }

        for (let j = 10; j >= 0; j--) {
            console.log('j = ', j);
        }
    </script>
</body>

</html>
